name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Tier 1: Fast checks (every commit)
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
    - uses: Swatinem/rust-cache@v2

    - name: Check formatting
      run: cargo fmt --all -- --check

    - name: Run clippy (all features)
      run: cargo clippy --all-targets --all-features -- -D warnings

    - name: Run clippy (no default features)
      run: cargo clippy --all-targets --no-default-features -- -D warnings

  # Tier 1: Unit + property tests
  test:
    name: Test (${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: [stable, beta]
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.rust }}
    - uses: Swatinem/rust-cache@v2

    - name: Run all tests (all features)
      run: cargo test --all-features --workspace

    - name: Run tests (client-only, default features)
      run: cargo test --workspace

    - name: Run tests (no default features)
      run: cargo test --no-default-features --workspace

    - name: Verify binary builds and runs
      run: |
        cargo build --release -p open-tethyr-cli
        ./target/release/open-tethyr --version
        ./target/release/open-tethyr --help

  # Tier 2: Coverage (every PR)
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: llvm-tools-preview
    - uses: Swatinem/rust-cache@v2
    - uses: taiki-e/install-action@cargo-llvm-cov

    - name: Generate code coverage
      run: cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info

    - name: Check coverage threshold
      run: |
        COVERAGE=$(cargo llvm-cov --all-features --workspace --summary-only 2>&1 | grep -oP 'TOTAL.*?(\d+\.\d+)%' | grep -oP '\d+\.\d+' | head -1 || echo "0")
        echo "Coverage: ${COVERAGE}%"
        # Warn if below 60%, fail if below 40%
        if [ "$(echo "$COVERAGE < 40" | bc -l 2>/dev/null || echo 0)" = "1" ]; then
          echo "::error::Coverage ${COVERAGE}% is below minimum threshold of 40%"
          exit 1
        fi

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: lcov.info
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}

  # Tier 2: Security audit
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - name: Security audit
      uses: rustsec/audit-check@v1.4.1
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

  # Gate: all checks must pass
  ci-pass:
    name: CI Pass
    needs: [lint, test, coverage, security]
    if: always()
    runs-on: ubuntu-latest
    steps:
    - name: Check all jobs
      run: |
        if [[ "${{ needs.lint.result }}" != "success" ]] || \
           [[ "${{ needs.test.result }}" != "success" ]]; then
          echo "Required checks failed"
          exit 1
        fi
        # Coverage and security are advisory during development
        echo "All required checks passed"
